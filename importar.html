<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importar dados · Patrimônio</title>
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0A0A0B;color:#E8F1EF;font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:480px;width:100%;display:grid;gap:16px}
h1{margin:0;font-size:26px}
p{margin:0;color:#9DB3AE}
button,label.f{border:0;border-radius:14px;padding:14px 18px;font:600 16px system-ui;background:#E2BA6E;color:#0A0A0B;cursor:pointer;text-align:center}
button:disabled{opacity:.4;cursor:default}
label.f{background:#15262A;color:#E8F1EF;border:1px dashed #2E4A4F}
input[type=file]{display:none}
#log{background:#0F1E21;border-radius:14px;padding:14px;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;min-height:60px}
.ok{color:#7FE0B0}.er{color:#FF8A7A}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Importar dados</h1>
  <p>Use esta página uma vez, para trazer o backup do app antigo para o banco novo. Rodar de novo com o mesmo arquivo não duplica nada: cada registro é regravado com o mesmo código.</p>
  <button type="button" id="entrar">Entrar com Google</button>
  <div id="passo" hidden>
    <p id="quem"></p>
    <label class="f" for="arq" id="arqlbl">Escolher arquivo de backup (.json)</label>
    <input type="file" id="arq" accept="application/json,.json">
  </div>
  <button type="button" id="importar" hidden disabled>Importar</button>
  <div id="log">Aguardando login.</div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,writeBatch,doc,getCountFromServer,collection} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyAhEF_UqkFKjPemovKLNVYnuxdeAwFPJ1Y",authDomain:"patrimonio-uilian.firebaseapp.com",projectId:"patrimonio-uilian",storageBucket:"patrimonio-uilian.firebasestorage.app",messagingSenderId:"433087123506",appId:"1:433087123506:web:2844eaaab62a987748ac2b"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app);
const $=id=>document.getElementById(id),log=(t,c)=>{$('log').innerHTML+='\n'+(c?`<span class="${c}">${t}</span>`:t)};
/* nome no backup → coleção no banco */
const MAPA={contas:'contas',cartoes:'cartoes',lancamentos:'lanc',dividas:'dividas',recorrentes:'recorrentes',acertos:'acertos',relatorios:'relatorios'};
let dados=null;
$('entrar').onclick=async()=>{const pv=new GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,pv)}catch(e){if(e&&e.code==='auth/popup-blocked')await signInWithRedirect(auth,pv);else log('Não consegui entrar: '+(e.code||e.message),'er')}};
onAuthStateChanged(auth,u=>{if(!u)return;$('entrar').hidden=true;$('passo').hidden=false;$('importar').hidden=false;$('quem').textContent='Conectado como '+u.email;$('log').textContent='Escolha o arquivo de backup.'});
$('arq').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('arqlbl').textContent=f.name;
  try{dados=JSON.parse(await f.text())}catch(er){dados=null;$('log').textContent='';log('Arquivo não é um backup válido.','er');return}
  if(dados.app!=='patrimonio'){dados=null;$('log').textContent='';log('Este arquivo não é um backup do Patrimônio.','er');return}
  $('log').textContent='Backup de '+(dados.geradoEm||'').slice(0,10)+':';
  if(dados.config)log('  config: 1');Object.keys(MAPA).forEach(k=>log(`  ${k}: ${(dados[k]||[]).length}`));
  $('importar').disabled=false};
$('importar').onclick=async()=>{if(!dados)return;$('importar').disabled=true;log('\nImportando…');
  try{
    const ops=[];if(dados.config)ops.push(['config','app',dados.config]);
    Object.entries(MAPA).forEach(([k,c])=>(dados[k]||[]).forEach(o=>{const d=Object.assign({},o);const id=d.id;delete d.id;if(id)ops.push([c,id,d])}));
    for(let i=0;i<ops.length;i+=400){const b=writeBatch(fs);ops.slice(i,i+400).forEach(([c,id,d])=>b.set(doc(fs,c,id),JSON.parse(JSON.stringify(d))));await b.commit();log(`  gravados ${Math.min(i+400,ops.length)} de ${ops.length}`)}
    log('\nConferindo no banco:');
    for(const [k,c] of Object.entries(MAPA)){const n=(await getCountFromServer(collection(fs,c))).data().count;const esp=(dados[k]||[]).length;log(`  ${k}: ${n} no banco · ${esp} no arquivo`,n>=esp?'ok':'er')}
    log('\nImportação concluída. Abra o app pelo link principal.','ok');
  }catch(e){log('Erro: '+(e.code==='permission-denied'?'este e-mail não tem permissão nas regras do banco.':e.message||e.code),'er');$('importar').disabled=false}};
</script>
</body>
</html>
