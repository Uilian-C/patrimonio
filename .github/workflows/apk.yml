name: APK Android
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
env:
  HAS_SECRET: ${{ secrets.KEYSTORE_B64 != '' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      # chave de assinatura: nunca fica no repositório.
      # Preferência: secrets KEYSTORE_B64 + KEYSTORE_PASS. Sem eles, usa uma chave guardada no cache privado do Actions.
      - name: Restore signing key cache
        if: ${{ env.HAS_SECRET != 'true' }}
        uses: actions/cache@v4
        with: { path: ~/.patrimonio-key, key: patrimonio-signing-key-v1 }
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; PASS="$KEYSTORE_PASS"
          else
            mkdir -p ~/.patrimonio-key
            if [ ! -f ~/.patrimonio-key/release.jks ]; then
              openssl rand -hex 16 > ~/.patrimonio-key/pass
              keytool -genkeypair -keystore ~/.patrimonio-key/release.jks -alias patrimonio -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$(cat ~/.patrimonio-key/pass)" -keypass "$(cat ~/.patrimonio-key/pass)" -dname "CN=Patrimonio, C=BR"
            fi
            cp ~/.patrimonio-key/release.jks "$RUNNER_TEMP/release.jks"; PASS="$(cat ~/.patrimonio-key/pass)"
          fi
          echo "::add-mask::$PASS"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" | grep SHA256: || true
      - name: Build
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Publish APK in the site
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk patrimonio.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add patrimonio.apk
          git commit -m "APK ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase
          git push
